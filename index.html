<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jesse</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=New+Rocker&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0510;
    --maroon: #7d1035;
    --wine: #c0194f;
    --violet: #9b5cff;
    --plum: #3a1247;
    --ink: #f5ebf7;
    --muted: #b9a3c3;
    --card: rgba(20, 7, 24, .84);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(ellipse 90% 55% at 50% 118%, rgba(192, 25, 79, .42), transparent 70%),
      radial-gradient(ellipse 70% 45% at 15% -10%, rgba(155, 92, 255, .28), transparent 70%),
      radial-gradient(ellipse 70% 45% at 85% -10%, rgba(125, 16, 53, .35), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Rubik", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  ::selection { background: var(--wine); color: var(--ink); }

  #embers { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  /* ---------- enter screen ---------- */
  .screen {
    position: fixed; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 16px; text-align: center;
  }
  .neon {
    font-family: "New Rocker", serif; font-weight: 400;
    font-size: clamp(3rem, 13vw, 6.5rem); line-height: 1; margin: 0;
    color: #fbe9ff;
    text-shadow: 0 0 6px #fff, 0 0 18px var(--violet), 0 0 42px var(--wine), 0 0 80px var(--wine);
    animation: flicker 5s infinite;
  }
  @keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: .35; text-shadow: none; }
  }
  #enterBtn {
    margin-top: 26px;
    font-family: "New Rocker", serif; font-size: 1.5rem; letter-spacing: .05em;
    color: var(--ink); background: rgba(155, 92, 255, .12);
    border: 1px solid var(--violet); border-radius: 999px;
    padding: .2em 1.5em; cursor: pointer;
    opacity: 0; animation: fadeIn .8s 1.1s forwards, pulse 2.4s 2s infinite;
  }
  #enterBtn:hover, #enterBtn:focus-visible {
    background: linear-gradient(135deg, var(--violet), var(--wine)); outline: none;
    box-shadow: 0 0 28px rgba(192, 25, 79, .7);
  }
  @keyframes fadeIn { to { opacity: 1; } }
  @keyframes pulse { 50% { box-shadow: 0 0 24px rgba(155, 92, 255, .7); } }

  /* ---------- profile ---------- */
  main { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; }
  main[hidden] { display: none; }

  .bg-sigil {
    position: fixed; top: 50%; left: 50%; z-index: 0; width: min(780px, 140vw);
    transform: translate(-50%, -50%); opacity: .4; pointer-events: none;
    filter: drop-shadow(0 0 10px rgba(192, 25, 79, .6));
    animation: spin 140s linear infinite;
    transition: opacity 1.2s ease;
  }
  body.entered .bg-sigil { opacity: .16; }
  .bg-sigil g { fill: none; stroke: url(#sigilGrad); stroke-width: 1.6; stroke-linejoin: round; }
  .bg-sigil g > * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2s ease-out forwards; }
  .bg-sigil g > polygon { animation-delay: .7s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .card {
    position: relative;
    width: min(440px, 100%);
    padding: 52px 26px 20px;
    background: var(--card);
    border: 1px solid rgba(192, 25, 79, .5);
    border-radius: 22px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 0 60px rgba(155, 92, 255, .18), 0 0 40px rgba(192, 25, 79, .2), inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(6px);
    text-align: center;
    animation: rise .7s cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.98); } }

  .pass {
    position: absolute; top: 14px; left: 18px; right: 18px;
    display: flex; justify-content: center;
    font-size: .7rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted);
  }
  .pass b { color: var(--wine); }

  .avatar-ring {
    width: 124px; height: 124px; margin: 0 auto 14px; border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 200deg, var(--violet), var(--wine), var(--maroon), var(--violet));
    box-shadow: 0 0 30px rgba(155, 92, 255, .45), 0 0 50px rgba(192, 25, 79, .3);
    animation: ring 6s linear infinite;
  }
  @keyframes ring { 50% { box-shadow: 0 0 36px rgba(192, 25, 79, .6), 0 0 60px rgba(155, 92, 255, .35); } }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    background: var(--plum); border: 3px solid var(--bg);
    display: grid; place-items: center;
    font-family: "New Rocker", serif; font-size: 3.4rem; color: var(--ink);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .name {
    font-family: "New Rocker", serif; font-weight: 400;
    font-size: 3rem; line-height: 1; margin: 0;
    color: #fbe9ff;
    animation: glow 3.4s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 10px rgba(155, 92, 255, .9), 0 0 30px rgba(192, 25, 79, .45); }
    50%      { text-shadow: 0 0 14px rgba(192, 25, 79, .95), 0 0 38px rgba(155, 92, 255, .55); }
  }
  .tagline { margin: 8px 0 24px; color: var(--wine); font-weight: 600; font-size: .95rem; letter-spacing: .03em; filter: brightness(1.35); }



  .setlist-title {
    display: flex; align-items: center; gap: 10px; margin: 0 0 10px;
    font-size: .72rem; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--muted);
  }
  .setlist-title::before, .setlist-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(192, 25, 79, .6), transparent); }

  .links { display: grid; gap: 9px; }
  .links .item {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 11px 16px;
    font: inherit; font-weight: 600; text-align: left; cursor: pointer;
    color: var(--ink); text-decoration: none;
    background: rgba(155, 92, 255, .06);
    border: 1px solid rgba(192, 25, 79, .38);
    border-radius: 12px;
    transition: background .2s, box-shadow .2s, transform .2s, border-color .2s;
  }
  .links .item .no { color: var(--wine); font-weight: 700; font-size: .8rem; font-variant-numeric: tabular-nums; filter: brightness(1.3); }
  .links .item .host { margin-left: auto; color: var(--muted); font-size: .82rem; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .links .item:hover, .links .item:focus-visible {
    background: linear-gradient(135deg, var(--violet), var(--wine));
    border-color: transparent; outline: none;
    box-shadow: 0 0 24px rgba(192, 25, 79, .45); transform: translateY(-2px);
  }
  .links .item:hover span, .links .item:focus-visible span { color: var(--ink); filter: none; }

  .card footer {
    margin-top: 18px; display: flex; justify-content: center; gap: 8px;
    font-size: .76rem; color: var(--muted); letter-spacing: .1em; text-transform: uppercase;
  }
  .card footer b { color: #d9c2ff; font-weight: 700; font-variant-numeric: tabular-nums; }

  @media (max-width: 480px) {
    .card { padding: 48px 18px 18px; }
    .name { font-size: 2.5rem; }
    .links .item .host { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

<canvas id="embers" aria-hidden="true"></canvas>

<svg class="bg-sigil" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <linearGradient id="sigilGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#c0194f"/>
    </linearGradient>
  </defs>
  <g>
    <circle cx="100" cy="100" r="96" pathLength="1"/>
    <circle cx="100" cy="100" r="88" pathLength="1"/>
    <polygon points="100,12 151.7,171.2 16.3,72.8 183.7,72.8 48.3,171.2" pathLength="1"/>
  </g>
</svg>

<div class="screen" id="enter">
  <h1 class="neon" id="neonName"></h1>
  <button id="enterBtn" type="button">enter</button>
</div>

<main id="app" hidden>
  <article class="card">
    <div class="pass"><span><b>★</b> backstage pass</span></div>

    <div class="avatar-ring"><div class="avatar" id="avatar"></div></div>

    <h1 class="name" id="name"></h1>
    <p class="tagline" id="tagline"></p>

    <h2 class="setlist-title">setlist</h2>
    <nav class="links" id="links" aria-label="links"></nav>

    <footer>crowd <b id="views">------</b></footer>
  </article>
</main>

<script>
/* =========================================================
   EDIT THIS — everything personal lives here.
   ========================================================= */
const CONFIG = {
  handle: "Jesse",
  tagline: "senior software engineer",
  // Profile picture from your Spotify page. Use any image URL or a local file like "me.png".
  avatar: "https://i.scdn.co/image/ab67757000004cf8a79c78f5b495bee993beac59",
  // Each entry needs a `url` (opens it) or a `copy` (copies that text to the clipboard on click).
  links: [
    { label: "github",    url: "https://github.com/purreo" },
    { label: "discord",   copy: "junsoreos" },
    { label: "instagram", url: "https://instagram.com/junssbutt" },
    { label: "spotify",   url: "https://open.spotify.com/user/inekky" }
  ],
  viewsEndpoint: ""           // optional: URL returning {"views": 123}; empty = counts visits in this browser only
};

/* ========================================================= */

const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
};

/* ---------- tab icon: paint the 🐾 emoji into a PNG (works in every browser) ---------- */
function setFavicon(emoji) {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const x = c.getContext("2d");
    x.font = "54px 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif";
    x.textAlign = "center";
    x.textBaseline = "middle";
    x.fillText(emoji, 32, 36);
    const link = $("#favicon");
    link.type = "image/png";
    link.href = c.toDataURL("image/png");
  } catch {}
}

/* ---------- fill in the card ---------- */
function render() {
  document.title = CONFIG.handle;
  $("#neonName").textContent = CONFIG.handle;
  $("#name").textContent = CONFIG.handle;
  $("#tagline").textContent = CONFIG.tagline;

  const avatar = $("#avatar");
  const letter = () => { avatar.textContent = CONFIG.handle.charAt(0).toUpperCase(); };
  if (CONFIG.avatar) {
    const img = el("img");
    img.src = CONFIG.avatar;
    img.alt = CONFIG.handle;
    img.onerror = () => { img.remove(); letter(); };   // image gone? fall back to the initial
    avatar.append(img);
  } else {
    letter();
  }

  const links = $("#links");
  CONFIG.links.forEach(({ label, url, copy }, i) => {
    let item, host = "";
    const labelEl = el("span", "label", label);
    if (copy) {
      item = el("button", "item");
      item.type = "button";
      item.title = `copy ${copy}`;
      host = `${copy} · click to copy`;
      item.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(copy);
          labelEl.textContent = "copied!";
        } catch {
          labelEl.textContent = copy;   // clipboard blocked: at least show the name
        }
        setTimeout(() => { labelEl.textContent = label; }, 1500);
      });
    } else {
      item = el("a", "item");
      item.href = url;
      item.target = "_blank";
      item.rel = "noopener noreferrer";
      try { const u = new URL(url); host = u.host.replace(/^www\./, "") + u.pathname.replace(/\/$/, ""); } catch {}
    }
    item.append(el("span", "no", String(i + 1).padStart(2, "0")), labelEl, el("span", "host", host));
    links.append(item);
  });
}

/* ---------- view counter ---------- */
async function loadViews() {
  let n = null;
  if (CONFIG.viewsEndpoint) {
    try {
      const res = await fetch(CONFIG.viewsEndpoint);
      n = (await res.json()).views;
    } catch {}
  }
  if (n == null) {
    try {
      n = (parseInt(localStorage.getItem("views") || "0", 10) || 0) + 1;
      localStorage.setItem("views", String(n));
    } catch { n = 1; }
  }
  $("#views").textContent = String(n).padStart(6, "0");
}

/* ---------- rising embers (maroon fire + violet sparks) ---------- */
function embers() {
  const canvas = $("#embers");
  const ctx = canvas.getContext("2d");
  let w, h, dpr;
  const parts = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.width = innerWidth * dpr;
    h = canvas.height = innerHeight * dpr;
  }
  function spawn(anywhere) {
    const violet = Math.random() < 0.35;
    return {
      x: Math.random() * w,
      y: anywhere ? Math.random() * h : h + 10 * dpr,
      r: (0.6 + Math.random() * 1.8) * dpr,
      vy: (0.3 + Math.random() * 1.1) * dpr,
      sway: Math.random() * Math.PI * 2,
      hue: violet ? 265 + Math.random() * 25 : 335 + Math.random() * 25,
      life: 0.4 + Math.random() * 0.6
    };
  }
  resize();
  addEventListener("resize", resize);
  const count = Math.round(Math.min(90, innerWidth / 14));
  for (let i = 0; i < count; i++) parts.push(spawn(true));

  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = "lighter";
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      p.y -= p.vy;
      p.sway += 0.02;
      p.x += Math.sin(p.sway) * 0.4 * dpr;
      const fade = Math.max(0, Math.min(1, p.y / h)) * p.life;
      ctx.fillStyle = `hsla(${p.hue}, 100%, 62%, ${fade})`;
      ctx.shadowColor = `hsla(${p.hue}, 100%, 55%, ${fade})`;
      ctx.shadowBlur = 8 * dpr;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      if (p.y < -10) parts[i] = spawn(false);
    }
    if (!reduceMotion) requestAnimationFrame(draw);
  }
  draw();
}

/* ---------- wire up ---------- */
let entered = false;
function enter() {
  if (entered) return;
  entered = true;
  $("#enter").remove();
  document.body.classList.add("entered");
  $("#app").hidden = false;
  loadViews();
}

setFavicon("🐾");
render();
embers();
$("#enterBtn").addEventListener("click", enter);
</script>
</body>
</html>
